services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teachwell
      POSTGRES_USER: teachwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachwell -d teachwell"]
      interval: 5s
      timeout: 3s
      retries: 15
  setup:
    build: .
    command: ["--seed"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Database=teachwell;Username=teachwell;Password=${POSTGRES_PASSWORD}
      Demo__Password: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      Features__DemoAuth: "true"
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *api-environment
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - keys:/home/app/.aspnet/DataProtection-Keys
  web:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - api
volumes:
  postgres:
  keys:
  caddy:
